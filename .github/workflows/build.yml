name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dsi-touch-calibration-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publishes the APK at a fixed link:
      # https://github.com/<owner>/<repo>/releases/download/latest/DSi-Touch-Calibration.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DSi-Touch-Calibration.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DSi-Touch-Calibration.apk \
            --target "$GITHUB_SHA" \
            --title "DSi Touch Calibration (latest build)" \
            --notes "Tap DSi-Touch-Calibration.apk below on your Android phone to download it, then open it to install."
